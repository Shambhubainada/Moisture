<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#176b3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>FSD Sabarmati Truck Wise Moisture</title><link rel="manifest" href="manifest.json">
<style>
:root{--g:#176b3a;--gl:#eaf6ee;--r:#c62828;--b:#1565c0;--ink:#193126;--mut:#68756d;--line:#dbe6df}
*{box-sizing:border-box}body{margin:0;background:#f4f7f5;color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,Arial,sans-serif}
header{background:linear-gradient(#e8f7ed,#fff);padding:8px 10px 7px;text-align:center;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:4}
.brand{font-weight:900;font-size:20px;letter-spacing:1px;color:var(--g)}.title{font-weight:900;font-size:18px}.visual{display:flex;justify-content:center;align-items:center;gap:13px;height:55px}.truck{font-size:48px}.fci{width:47px;height:47px;border:2px solid var(--g);border-radius:50%;background:#fff;display:grid;place-items:center;font-size:10px;font-weight:900;color:var(--g)}
main{max-width:760px;margin:auto;padding:9px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:11px;margin:8px 0;box-shadow:0 2px 8px #153d1b0b}
button{font:inherit;font-weight:800;border:0;border-radius:11px;padding:10px 13px;cursor:pointer}.primary{background:var(--g);color:white}.ghost{background:#fff;border:1px solid var(--line)}.danger{background:#fff0f0;color:var(--r);border:1px solid #efb8b8}.wide{width:100%}
.section{font-weight:900;display:flex;justify-content:space-between;align-items:center;margin:2px 0 8px}.count{background:var(--gl);color:var(--g);border-radius:999px;padding:3px 8px;font-size:12px}
.stack{display:grid;grid-template-columns:1fr auto;gap:5px;align-items:center;padding:7px 8px;border:1px solid var(--line);border-radius:10px;margin:4px 0}.stack.w{background:#fff8d9;border-left:6px solid #d0a400}.stack.r{background:#eaf5ff;border-left:6px solid #2385c7}.stack.w{border-left:6px solid #d0a400}.stack.r{border-left:6px solid #2385c7}.stackname{font-weight:900}.meta{font-size:12px;color:var(--mut);margin-top:2px}.actions{display:flex;gap:5px}.actions button{padding:7px 9px;font-size:12px}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-start;justify-content:center;padding:8px;z-index:30;overflow:auto}.modal.show{display:flex}.sheet{width:min(520px,100%);background:#fff;border-radius:17px;padding:13px;margin-top:max(8px,env(safe-area-inset-top));max-height:calc(100dvh - 16px);overflow:auto;box-shadow:0 12px 35px #0005}
.mhead{display:flex;justify-content:space-between;align-items:center;font-weight:900;margin-bottom:8px;gap:6px}.mhead b{flex:1;text-align:center}.x{font-size:22px;background:#f2f4f2;padding:3px 9px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.moistgrid{grid-template-columns:1fr 1fr;gap:5px}.moistgrid .field input{padding:9px;font-size:15px}.field label{display:block;font-size:12px;font-weight:800;color:var(--mut);margin-bottom:4px}.field input,.field select{width:100%;padding:11px;border:1px solid #cbd8d0;border-radius:10px;font-size:16px;background:#fff}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:7px 0}.sum{background:var(--gl);border-radius:10px;padding:7px;text-align:center;font-size:12px}.sum b{display:block;font-size:15px}
.diff{font-weight:900;font-size:15px;padding:9px;border-radius:10px;text-align:center;background:#f1f4f2}.pos{color:#087b35;background:#eaf7ee}.neg{color:var(--r);background:#fff0f0}
.entries{overflow-x:auto}.entry{min-width:0;background:#f8fbf9;border:1px solid #dfeae4;border-radius:8px;margin:4px 0;display:grid;grid-template-columns:25px 1.05fr .7fr .65fr .9fr;gap:2px;align-items:center;border-bottom:1px solid var(--line);padding:5px 1px;font-size:11px}.entry.has-truck{grid-template-columns:22px .95fr .62fr .62fr .75fr .9fr}.entry.no-truck{grid-template-columns:22px .72fr .62fr .62fr .9fr}.entry button{white-space:nowrap}.entryhead{font-size:10px}.entryhead{font-weight:900;background:#eef5f1;border:0;border-radius:5px;margin:2px 0}.saved-list .entry{box-shadow:0 1px 2px rgba(0,0,0,.04)}.under{font-size:12px;padding:7px 0;color:var(--mut)}.stack-moisture-summary{margin-top:7px;padding:8px 9px;background:#f1f7f4;border:1px solid #d9e8e0;border-radius:8px;line-height:1.7;font-size:11px;color:#315246}.complete{margin-top:9px}.complete:disabled{opacity:.45}
.login{position:fixed;inset:0;background:#eef7f0;display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}.loginbox{width:min(380px,100%);background:white;border-radius:20px;padding:20px;text-align:center;border:1px solid var(--line)}.loginbox input{width:100%;padding:13px;font-size:20px;text-align:center;letter-spacing:5px;border:1px solid var(--line);border-radius:12px;margin:10px 0}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#173126;color:#fff;padding:9px 13px;border-radius:999px;display:none;z-index:80;font-size:13px}
@media(max-width:520px){header{padding-top:6px}.brand{font-size:18px}.title{font-size:16px}.truck{font-size:42px}.fci{width:42px;height:42px}.visual{height:47px}.grid{grid-template-columns:1fr 1fr}.sheet{margin-top:5px;padding:11px}.summary{gap:4px}.sum{padding:6px 3px}.stack{padding:8px}.actions button{padding:7px 8px}}
@media(max-width:360px){.stack{grid-template-columns:1fr}.actions{justify-content:flex-end}.grid{grid-template-columns:1fr}.moistgrid{grid-template-columns:1fr 1fr}.summary{grid-template-columns:repeat(3,1fr)}}
.saved-wheat{background:#fff8dc;border-color:#ead79a}.saved-rice{background:#eaf5ff;border-color:#b9d9ef}.saved-wheat span,.saved-rice span{min-width:0}.saved-wheat button,.saved-rice button{font-size:10px!important;padding:3px 6px!important}</style>
</head>
<body>
<header>
  <div class="visual"><div class="truck">🚛</div><div><div class="brand">FSD SABARMATI</div><div class="title">TRUCK WISE MOISTURE</div></div><div class="fci">FCI<br>INDIA</div></div>
</header>
<main>
  <div class="card"><button class="primary wide" onclick="openStack()">➕ ADD STACK</button></div>
  <div class="card"><div class="section">UNDER ISSUE STACK <span class="count" id="ucount">0</span></div><div id="under"></div></div>
  <div class="card"><div class="section">HISTORY <button class="danger" onclick="pinAction('history')">🗑 CLEAR HISTORY</button></div><div id="history"></div></div>
</main>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="login" id="login"><div class="loginbox"><div style="font-size:40px">🔐</div><h2>FSD Sabarmati</h2><div>Enter PIN to open Moisture Sheet</div><input id="loginpin" type="password" inputmode="numeric" maxlength="8" placeholder="PIN"><button class="primary wide" onclick="login()">LOGIN</button><div style="font-size:12px;color:#68756d;margin-top:8px">Testing PIN: 9001</div></div></div>
<div class="toast" id="toast"></div>

<script>
const PIN="9001", KEY="fsd_sabarmati_moisture_final", SESSION="fsd_sabarmati_session", VIEW="fsd_sabarmati_current_stack";
let db=JSON.parse(localStorage.getItem(KEY)||'{"stacks":[],"history":[]}'), current=null;
function isUnlocked(){return sessionStorage.getItem(SESSION)==='1'}
function unlock(){sessionStorage.setItem(SESSION,'1')}
function restoreView(){const id=sessionStorage.getItem(VIEW); if(id && db.stacks.some(s=>s.id===id)) openStackView(id); else render()}
function backHome(){sessionStorage.removeItem(VIEW); closeModal(); if(location.hash) history.replaceState(null,'',location.pathname+location.search); render(); window.scrollTo({top:0,behavior:'instant'});}

function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function toast(s){let e=document.getElementById('toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}
function closeModal(){document.getElementById('modal').classList.remove('show');current=null}
function show(html){document.getElementById('sheet').innerHTML=html;document.getElementById('modal').classList.add('show')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function calc(s){let used=s.entries.reduce((a,e)=>a+Number(e.bags||0),0);let wt=s.entries.reduce((a,e)=>a+Number(e.bags||0)*Number(e.moisture||0),0);let imc=used?wt/used:0;return {used,remaining:Number(s.total)-used,imc,diff:imc-Number(s.rmc)}}
function openStack(id=null){
 let s=id?db.stacks.find(x=>x.id===id):null;
 show(`<div class="mhead"><button class="ghost" onclick="backHome()">← BACK</button><b>${s?'✏️ EDIT STACK':'➕ ADD STACK'}</b><button class="x" onclick="backHome()">×</button></div>
 <div class="grid">
 <div class="field"><label>STACK NUMBER</label><input id="fstack" value="${esc(s?.stack||'')}"></div>
 <div class="field"><label>TOTAL BAGS</label><input id="ftotal" type="number" inputmode="numeric" value="${s?.total??''}"></div>
 <div class="field"><label>RMC % ${s?'🔐 PIN required to change':''}</label><input id="frmc" type="number" step="0.01" value="${s?.rmc??''}"></div>
 <div class="field"><label>COMMODITY</label><select id="fcom"><option ${s?.commodity==='Rice'||!s?'selected':''}>Rice</option><option ${s?.commodity==='Wheat'?'selected':''}>Wheat</option></select></div>
 </div><div style="margin-top:10px"><button class="primary wide" onclick="saveStack('${s?.id||''}')">${s?'SAVE CHANGES':'ADD STACK'}</button></div>`);
}
function saveStack(id){
 let stack=document.getElementById('fstack').value.trim(), total=Number(document.getElementById('ftotal').value), rmc=Number(document.getElementById('frmc').value), com=document.getElementById('fcom').value;
 if(!stack||!total||rmc<0){toast('Please fill all stack details');return}
 if(id){
   let s=db.stacks.find(x=>x.id===id), old=s.rmc;
   if(old!==rmc && !askPin('RMC change'))return;
   s.stack=stack;s.total=total;s.rmc=rmc;s.commodity=com;
 }else db.stacks.push({id:Date.now().toString(),stack,total,rmc,commodity:com,entries:[],created:Date.now()});
 save();closeModal();toast('Stack saved');
}
function askPin(label){
 let p=prompt(label+' PIN'); if(p!==PIN){alert('Wrong PIN');return false} return true;
}
function deleteStack(id){
 if(!askPin('Delete Under Issue Stack'))return;
 db.stacks=db.stacks.filter(s=>s.id!==id);save();toast('Stack deleted');
}
function openStackView(id){
 const s0=db.stacks.find(x=>x.id===id); if(!s0){backHome();return;}
 current=id; sessionStorage.setItem(VIEW,id); location.hash='stack-'+id;
 closeModal();
 render();
 const s=db.stacks.find(x=>x.id===id); if(!s)return;
 const c=calc(s);
 const main=document.querySelector('main');
 const old=document.getElementById('selectedStackView'); if(old)old.remove();
 const wrap=document.createElement('div');
 wrap.id='selectedStackView';
 wrap.innerHTML=`<div class="card">
   <div class="mhead"><button class="ghost" onclick="backHome()">← BACK</button><b>💧 ${esc(s.stack)} — ${esc(s.commodity)}</b><button class="ghost" onclick="openStack('${s.id}')">✏️</button></div>
   <div class="summary"><div class="sum">STACK<b>${esc(s.stack)}</b></div><div class="sum">RMC<b>${Number(s.rmc).toFixed(2)}%</b></div><div class="sum">REMAINING<b>${c.remaining}</b></div></div>
   <button class="primary wide" onclick="openMoisture('${s.id}')">💧 UPDATE MOISTURE</button>
 </div>
 <div class="card"><div class="section">SAVED MOISTURE ENTRIES <span class="count">${s.entries.length}</span></div>
   <div class="entries">${entriesHtml(s)}</div>
   ${c.remaining<=50&&c.remaining>=-100 ? `<div style="display:flex;gap:7px;margin-top:8px"><button class="primary wide complete" style="flex:1" onclick="completeStack('${s.id}')">✅ COMPLETE STACK</button><button class="ghost" style="min-width:92px" onclick="openStackDetails('${s.id}')">📋 DETAILS</button></div><div class="under">Complete allowed only when Remaining Bags is between <b>50 and -100</b>.</div>` : ''}
 </div>`;
 const underCard=document.getElementById('under')?.closest('.card');
 if(underCard) underCard.insertAdjacentElement('afterend',wrap); else main.appendChild(wrap);
 wrap.scrollIntoView({behavior:'smooth',block:'start'});
}

function openHistoryDetails(id){
 const s=db.history.find(x=>x.id===id); if(!s){render();return;}
 current=null; sessionStorage.removeItem(VIEW); location.hash='history-details-'+id;
 closeModal(); render();
 const c=calc(s), main=document.querySelector('main');
 const old=document.getElementById('selectedStackView'); if(old)old.remove();
 const wrap=document.createElement('div'); wrap.id='selectedStackView';
 const diffColor=c.diff<0?'#c62828':'#087b35';
 const hasTruck=s.entries.some(e=>String(e.truck||'').trim()!=='');
 const rows=s.entries.length?s.entries.map((e,i)=>`<div class="entry ${s.commodity==='Wheat'?'saved-wheat':'saved-rice'}${hasTruck?' has-truck':' no-truck'}"><span>${i+1}</span>${hasTruck?`<span>${esc(e.truck||'')}</span>`:''}<span>${e.bags}</span><span>${Number(e.moisture).toFixed(2)}%</span><span>${e.slip?'<b style="color:#087b35">YES</b>':'<b style="color:#c62828">NO</b>'}</span></div>`).join(''):'<div class="empty">No moisture entry saved.</div>';
 const head=`<div class="entry${hasTruck?' has-truck':' no-truck'} entryhead"><span>#</span>${hasTruck?'<span>Truck</span>':''}<span>Bags</span><span>Moist.</span><span>Slip</span></div>`;
 wrap.innerHTML=`<div class="card"><div class="mhead"><button class="ghost" onclick="render();window.scrollTo({top:0,behavior:'instant'})">← BACK</button><b>📋 COMPLETED STACK DETAILS</b><span class="badge">COMPLETED</span></div><div class="summary"><div class="sum">STACK<b>${esc(s.stack)}</b></div><div class="sum">${esc(s.commodity)}<b>${s.entries.length} ENTRIES</b></div></div><div class="summary"><div class="sum">TOTAL BAGS<b>${s.total}</b></div><div class="sum">UPDATED BAGS<b>${c.used}</b></div><div class="sum">REMAINING<b>${s.remaining}</b></div></div><div class="summary"><div class="sum">RMC<b>${Number(s.rmc).toFixed(2)}%</b></div><div class="sum">CURRENT IMC<b>${c.imc.toFixed(2)}%</b></div><div class="sum">DIFFERENCE<b style="color:${diffColor}">${c.diff>=0?'+':''}${c.diff.toFixed(2)}%</b></div></div></div><div class="card"><div class="section">SAVED MOISTURE ENTRIES <span class="count">${s.entries.length}</span></div><div class="entries">${head}${rows}</div></div>`;
 const underCard=document.getElementById('under')?.closest('.card'); if(underCard)underCard.insertAdjacentElement('afterend',wrap); else main.appendChild(wrap);
 wrap.scrollIntoView({behavior:'smooth',block:'start'});
}

function openStackDetails(id){
 const s=db.stacks.find(x=>x.id===id); if(!s){backHome();return;}
 current=id; sessionStorage.setItem(VIEW,id); location.hash='details-'+id;
 closeModal(); render();
 const c=calc(s), main=document.querySelector('main');
 const old=document.getElementById('selectedStackView'); if(old)old.remove();
 const wrap=document.createElement('div'); wrap.id='selectedStackView';
 const diffColor=c.diff<0?'#c62828':'#087b35';
 const hasTruck=s.entries.some(e=>String(e.truck||'').trim()!=='');
 const rows=s.entries.length?s.entries.map((e,i)=>`<div class="entry ${s.commodity==='Wheat'?'saved-wheat':'saved-rice'}${hasTruck?' has-truck':' no-truck'}"><span>${i+1}</span>${hasTruck?`<span>${esc(e.truck||'')}</span>`:''}<span>${e.bags}</span><span>${Number(e.moisture).toFixed(2)}%</span><span>${e.slip?'<b style="color:#087b35">YES</b>':'<b style="color:#c62828">NO</b>'}</span><span><button class="ghost" style="padding:4px 7px;font-size:11px" onclick="editEntry('${s.id}',${i})">VIEW / EDIT</button></span></div>`).join(''):'<div class="empty">No moisture entry yet.</div>';
 const head=`<div class="entry${hasTruck?' has-truck':' no-truck'} entryhead"><span>#</span>${hasTruck?'<span>Truck</span>':''}<span>Bags</span><span>Moist.</span><span>Slip</span><span>Action</span></div>`;
 wrap.innerHTML=`<div class="card"><div class="mhead"><button class="ghost" onclick="openStackView('${s.id}')">← BACK</button><b>📋 STACK DETAILS</b><button class="ghost" onclick="openStack('${s.id}')">✏️</button></div><div class="summary"><div class="sum">STACK<b>${esc(s.stack)}</b></div><div class="sum">${esc(s.commodity)}<b>${s.entries.length} ENTRIES</b></div></div><div class="summary"><div class="sum">TOTAL BAGS<b>${s.total}</b></div><div class="sum">UPDATED BAGS<b>${c.used}</b></div><div class="sum">REMAINING<b>${c.remaining}</b></div></div><div class="summary"><div class="sum">RMC<b>${Number(s.rmc).toFixed(2)}%</b></div><div class="sum">CURRENT IMC<b>${c.imc.toFixed(2)}%</b></div><div class="sum">DIFFERENCE<b style="color:${diffColor}">${c.diff>=0?'+':''}${c.diff.toFixed(2)}%</b></div></div></div><div class="card"><div class="section">MOISTURE ENTRY DETAILS <span class="count">${s.entries.length}</span></div><div class="entries">${head}${rows}</div></div>`;
 const underCard=document.getElementById('under')?.closest('.card'); if(underCard)underCard.insertAdjacentElement('afterend',wrap); else main.appendChild(wrap);
 wrap.scrollIntoView({behavior:'smooth',block:'start'});
}

function entriesHtml(s){
 const hasTruck=s.entries.some(e=>String(e.truck||'').trim()!=='');
 const cols=hasTruck?' has-truck':' no-truck';
 let head=`<div class="entry${cols} entryhead"><span>#</span>${hasTruck?'<span>Truck</span>':''}<span>Bags</span><span>Moist.</span><span>Slip</span><span>Action</span></div>`;
 if(!s.entries.length)return head+'<div class="empty">No moisture entry yet.</div>';
 let rows=s.entries.map((e,i)=>{
   let slip=e.slip
     ? '<span style="background:#e8f7ed;color:#087b35;font-weight:900;padding:4px 7px;border-radius:7px">YES</span>'
     : '<span style="background:#fff0f0;color:#c62828;font-weight:900;padding:4px 7px;border-radius:7px">NO</span>';
   const rowClass=s.commodity==='Wheat'?'saved-wheat':'saved-rice'; return `<div class="entry ${rowClass}${cols}"><span>${i+1}</span>${hasTruck?`<span>${esc(e.truck||'')}</span>`:''}<span>${e.bags}</span><span>${Number(e.moisture).toFixed(2)}%</span><span><button class="ghost" style="padding:4px 7px;font-size:11px" onclick="toggleSlip('${s.id}',${i})">${slip}</button></span><span><button class="ghost" style="padding:4px 7px;font-size:11px" onclick="editEntry('${s.id}',${i})">EDIT</button> <button class="danger" style="padding:4px 7px;font-size:11px" onclick="deleteEntry('${s.id}',${i})">DEL</button></span></div>`;
 }).join('');
 const total=calc(s);
 const diffColor=total.diff<0?'#c62828':'#087b35';
 const summary=`<div class="under stack-moisture-summary"><b>STACK MOISTURE SUMMARY</b><br>RMC <b>${Number(s.rmc).toFixed(2)}%</b> &nbsp; | &nbsp; UPDATED BAGS <b>${total.used}</b> &nbsp; | &nbsp; IMC <b>${total.imc.toFixed(2)}%</b> &nbsp; | &nbsp; DIFFERENCE <b style="color:${diffColor}">${total.diff>=0?'+':''}${total.diff.toFixed(2)}%</b></div>`;
 return head+rows+summary;
}
function openMoisture(id,idx=null){
 let s=db.stacks.find(x=>x.id===id), e=idx==null?null:s.entries[idx], c=calc(s);
 show(`<div class="mhead"><button class="ghost" onclick="openStackView('${id}')">← BACK</button><b>💧 ${e?'EDIT':'UPDATE'} MOISTURE</b><button class="x" onclick="openStackView('${id}')">×</button></div>
 <div class="summary"><div class="sum">STACK<b>${esc(s.stack)}</b></div><div class="sum">RMC<b>${s.rmc.toFixed(2)}%</b></div><div class="sum">REMAINING<b id="rem">${c.remaining}</b></div></div>
 <div class="field"><label>TRUCK NUMBER (OPTIONAL)</label><input id="mtruck" value="${esc(e?.truck||'')}" placeholder="Optional"></div>
 <div class="grid moistgrid" style="margin-top:8px"><div class="field"><label>UPDATE BAGS</label><input id="mbags" type="number" inputmode="numeric" value="${e?.bags??''}" oninput="preview('${id}',${idx==null?'null':idx})"></div><div class="field"><label>MOISTURE %</label><input id="mmoist" type="number" step="0.01" inputmode="decimal" value="${e?.moisture??''}" oninput="preview('${id}',${idx==null?'null':idx})"></div></div>
 <div id="mdiff" class="diff" style="margin-top:8px">DIFFERENCE PROJECTION: —</div>
 <button class="primary wide" style="margin-top:10px" onclick="saveMoisture('${id}',${idx==null?'null':idx})">💾 SAVE UPDATE</button>`);
 preview(id,idx);
}
function preview(id,idx){
 let s=db.stacks.find(x=>x.id===id), bags=Number(document.getElementById('mbags')?.value||0), m=Number(document.getElementById('mmoist')?.value||0);
 let old=idx==null?0:Number(s.entries[idx]?.bags||0), entries=s.entries.filter((_,i)=>i!==idx); entries.push({bags,moisture:m});
 let c=calc({...s,entries}); let d=document.getElementById('mdiff');if(!d)return;
 d.textContent='Difference Projection: '+(c.diff>=0?'+':'')+c.diff.toFixed(2)+'%';d.className='diff '+(c.diff>0?'pos':c.diff<0?'neg':'');
}
function saveMoisture(id,idx){
 let s=db.stacks.find(x=>x.id===id), bags=Number(document.getElementById('mbags').value), m=Number(document.getElementById('mmoist').value), truck=document.getElementById('mtruck').value.trim(), slip=idx==null ? true : (s.entries[idx]?.slip!==false);
 let max=s.commodity==='Wheat'?14:15;if(!bags||bags<0||m<0||m>max){alert(`${s.commodity} maximum moisture is ${max}%`);return}
 let e={bags,moisture:m,truck,slip,date:new Date().toISOString()};if(idx==null)s.entries.push(e);else s.entries[idx]=e;save();openStackView(id);toast('Moisture saved');
}
function editEntry(id,i){openMoisture(id,i)}
function deleteEntry(id,i){if(!confirm('Delete this moisture entry?'))return;db.stacks.find(s=>s.id===id).entries.splice(i,1);save();openStackView(id)}
function toggleSlip(id,i){
 let s=db.stacks.find(x=>x.id===id); if(!s||!s.entries[i])return;
 s.entries[i].slip = s.entries[i].slip===true ? false : true;
 save();
 toast(s.entries[i].slip?'Slip: YES':'Slip: NO');
 openStackView(id);
}
function completeStack(id){
 let s=db.stacks.find(x=>x.id===id), c=calc(s);if(!(c.remaining<=50&&c.remaining>=-100))return;
 if(!confirm(`Complete stack ${s.stack} and move it to History?`))return;
 db.history.unshift({...s,completedAt:new Date().toISOString(),remaining:c.remaining});db.stacks=db.stacks.filter(x=>x.id!==id);save();closeModal();toast('Stack moved to History');
}
function pinAction(type){
 if(!askPin(type==='history'?'Clear History':'Action'))return;
 if(type==='history'){if(!confirm('Clear all History?'))return;db.history=[];save();toast('History cleared')}
}
function render(){
 document.getElementById("selectedStackView")?.remove();
 let u=document.getElementById('under'),h=document.getElementById('history');document.getElementById('ucount').textContent=db.stacks.length;
 u.innerHTML=db.stacks.length?db.stacks.map(s=>{let c=calc(s);return `<div class="stack ${s.commodity==='Wheat'?'w':'r'}"><div><div class="stackname">${esc(s.stack)} · ${s.commodity}</div><div class="meta">Total ${s.total} | Updated ${c.used} | Remaining <b>${c.remaining}</b> | RMC ${Number(s.rmc).toFixed(2)}%</div></div><div class="actions"><button class="ghost" onclick="openStackView('${s.id}')">OPEN</button><button class="danger" onclick="deleteStack('${s.id}')">DELETE</button></div></div>`}).join(''):'<div class="empty">No Under Issue Stack</div>';
 const all=document.getElementById('savedAll'); if(all) all.innerHTML='';
 h.innerHTML=db.history.length?db.history.map(s=>{let c=calc(s);return `<div class="stack ${s.commodity==='Wheat'?'w':'r'}"><div><div class="stackname">${esc(s.stack)} · ${s.commodity}</div><div class="meta">Total ${s.total} | Remaining ${s.remaining} | RMC ${Number(s.rmc).toFixed(2)}% | Entries ${s.entries.length}</div></div><div class="actions"><span class="badge">COMPLETED</span><button class="ghost" onclick="openHistoryDetails('${s.id}')">📋 DETAILS</button></div></div>`}).join(''):'<div class="empty">No History</div>';
}
function login(){if(document.getElementById('loginpin').value===PIN){unlock();document.getElementById('login').style.display='none';restoreView()}else alert('Wrong PIN')}
window.addEventListener('popstate',()=>{if(isUnlocked()){sessionStorage.removeItem(VIEW);closeModal();render()}});
window.addEventListener('hashchange',()=>{if(isUnlocked() && !location.hash){sessionStorage.removeItem(VIEW);closeModal();render()}});
window.addEventListener('popstate',()=>{if(isUnlocked()){sessionStorage.removeItem(VIEW);closeModal();render()}});
window.addEventListener('hashchange',()=>{if(isUnlocked() && !location.hash){sessionStorage.removeItem(VIEW);closeModal();render()}});
function init(){if(isUnlocked()){document.getElementById('login').style.display='none';restoreView()}else{document.getElementById('login').style.display='flex';render()}}
document.getElementById('loginpin').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
init();
</script>
