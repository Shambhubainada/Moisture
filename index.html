<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#197a43"><title>FSD Sabarmati - Truck Wise Moisture</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7f5;color:#17221b}.hero{height:270px;position:relative;display:flex;align-items:flex-end;padding:20px;color:#fff;background:linear-gradient(180deg,#1d6b3a00 20%,#0a2514d9 100%),url('farming.svg') center/cover}.heroShade{position:absolute;inset:0;background:linear-gradient(135deg,#0c5f3470,transparent 50%,#081c1090)}.heroContent{position:relative;z-index:1}.heroKicker{display:inline-block;background:#ffffff25;border:1px solid #ffffff55;padding:6px 10px;border-radius:20px;font-size:11px;font-weight:800}.hero h1{margin:10px 0 0;font-size:30px;letter-spacing:1px;text-shadow:0 2px 5px #0008}.hero p{margin:4px 0 0;font-size:16px;font-weight:800}.sectionHead{display:flex;justify-content:space-between;align-items:center;gap:8px}.eyebrow{font-size:10px;color:#6b776f;font-weight:800;letter-spacing:1px}.sectionHead h2{margin:2px 0 10px}.localBadge,.countBadge{font-size:10px;font-weight:800;padding:5px 8px;border-radius:15px;background:#e8f5ec;color:#197a43}.countBadge{min-width:28px;text-align:center}.commodityTitle{font-size:12px;font-weight:900;padding:8px 10px;border-radius:8px;margin:5px 0 7px}.wheatTitle{background:#fff3cc;color:#795500}.riceTitle{background:#e5f5ec;color:#11653d}main{max-width:900px;margin:auto;padding:10px}.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:11px;border:1px solid #e2e9e4;box-shadow:0 2px 9px #0001}h2{font-size:17px;margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}label{font-size:12px;font-weight:bold;display:block;margin-bottom:4px}input,select,button{width:100%;min-height:42px;border:1px solid #ccd6d0;border-radius:9px;padding:9px;font-size:15px;background:#fff}button{background:#197a43;color:#fff;border:0;font-weight:bold}.danger{background:#dc3545}.secondary{background:#edf3ef;color:#17432d;border:1px solid #d2ded6}.full{grid-column:1/-1}.muted,.small{font-size:12px;color:#66736b}.stack{border:1px solid #dce5df;border-radius:11px;padding:10px;margin:7px 0}.wheat{border-left:5px solid #d69a00}.rice{border-left:5px solid #198754}.top{display:flex;justify-content:space-between;gap:8px}.badge{font-size:11px;font-weight:bold;padding:4px 8px;border-radius:12px;background:#e9f4ed}.wheat .badge{background:#fff0c7}.stackActions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px;font-size:12px}th,td{padding:7px;border-bottom:1px solid #e5ebe7;text-align:left;vertical-align:middle}th{background:#f0f4f1}.pos{color:#148849;font-weight:800}.neg{color:#d32e3b;font-weight:800}.zero{font-weight:800}.entryCalc{background:#f5f8f6;border-radius:7px;padding:7px}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:5;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-width:600px;border-radius:18px 18px 0 0;padding:15px;max-height:92vh;overflow:auto}.summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.summary div{background:#f1f5f2;border-radius:8px;padding:8px;text-align:center;font-size:11px}.summary b{display:block;font-size:14px;margin-top:3px}.compact{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.diff{min-height:42px;border-radius:9px;background:#f1f5f2;padding:10px;text-align:center;font-weight:bold}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:18px}.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:480px){.hero{height:220px;padding:16px}.hero h1{font-size:25px}.compact{grid-template-columns:1fr 1fr}.diffwrap{grid-column:1/-1}}
</style></head><body>
<header class="hero"><div class="heroShade"></div><div class="heroContent"><div class="heroKicker">🌾 FARMING • TRUCK • MOISTURE</div><h1>FSD SABARMATI</h1><p>🚛 TRUCK WISE MOISTURE</p></div></header>
<main>
<section class="card"><div class="sectionHead"><div><span class="eyebrow">STACK MANAGEMENT</span><h2>➕ ADD STACK</h2></div><span class="localBadge">LOCAL TEST</span></div><div class="grid"><div><label>Stack Number *</label><input id="sn" placeholder="S-101"></div><div><label>Total Bags *</label><input id="tb" type="number" min="1" placeholder="2500"></div><div><label>RMC % *</label><input id="rmc" type="number" step=".01" placeholder="13.20"></div><div><label>Commodity *</label><select id="com"><option value="">Select</option><option>Wheat</option><option>Rice</option></select></div><div class="full"><button onclick="addStack()">➕ ADD STACK</button></div></div></section>
<section class="card"><div class="sectionHead"><div><span class="eyebrow">ACTIVE STACKS</span><h2>📋 UNDER ISSUE STACK</h2></div><span class="countBadge" id="issueCount">0</span></div><div class="commodityTitle wheatTitle">🌾 WHEAT</div><div id="wi"></div><div class="commodityTitle riceTitle">🌱 RICE</div><div id="ri"></div></section>
<section class="card"><h2>💧 SAVED MOISTURE ENTRIES</h2><div id="en"></div></section>
<section class="card"><h2>📚 COMPLETE STACK / HISTORY</h2><div id="hi"></div><button class="danger" style="margin-top:8px" onclick="clearHistory()">Clear History (PIN)</button></section>
</main>

<div class="modal" id="modal"><div class="sheet"><h2 id="modalTitle">💧 MOISTURE UPDATE</h2><div class="summary"><div>RMC<b id="mr">-</b></div><div>Remaining Bags<b id="mb">-</b></div><div>Commodity<b id="mc">-</b></div></div><div style="margin-top:10px"><label>TRUCK NUMBER (Optional)</label><input id="truck" placeholder="RJ14AB1234"></div><div class="compact" style="margin-top:10px"><div><label>UPDATE BAGS</label><input id="bags" type="number" min="1" oninput="preview()"></div><div><label>MOISTURE %</label><input id="moist" type="number" step=".01" oninput="preview()"></div><div class="diffwrap"><label>DIFFERENCE PROJECTION</label><div class="diff" id="df">—</div></div></div><div style="margin-top:9px"><label>SLIP</label><select id="slip"><option>Yes</option><option>No</option></select></div><div class="actions"><button class="secondary" onclick="closeUpdate()">Cancel</button><button onclick="saveEntry()">💾 SAVE UPDATE</button></div></div></div>

<div class="modal" id="stackModal"><div class="sheet"><h2>✏️ EDIT STACK / RMC</h2><input type="hidden" id="oldStack"><div class="grid"><div><label>Stack Number *</label><input id="esn"></div><div><label>Total Bags *</label><input id="etb" type="number" min="1"></div><div><label>RMC % *</label><input id="ermc" type="number" step=".01"></div><div><label>Commodity *</label><select id="ecom"><option>Wheat</option><option>Rice</option></select></div><div class="full"><button onclick="saveStackEdit()">💾 SAVE STACK / RMC</button></div><div class="full"><button class="secondary" onclick="closeStackEdit()">Cancel</button></div></div></div></div>

<script>
const K='fsd_sabarmati_moisture_v1';let db=JSON.parse(localStorage.getItem(K)||'{"stacks":{},"history":{}}'),cur=null,editId=null;
const $=id=>document.getElementById(id),N=x=>Number(x)||0;
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function saveDB(){localStorage.setItem(K,JSON.stringify(db));render()}
function used(s,skipId=null){return s.entries.filter(e=>e.id!==skipId).reduce((a,e)=>a+N(e.bags),0)}
function rem(s,skipId=null){return N(s.total)-used(s,skipId)}
function imc(s,extraBags=0,extraMoist=0,skipId=null){let B=used(s,skipId),W=s.entries.filter(e=>e.id!==skipId).reduce((a,e)=>a+N(e.bags)*N(e.moist),0);B+=N(extraBags);W+=N(extraBags)*N(extraMoist);return B?W/B:0}
function diffClass(d){return d>0?'pos':d<0?'neg':'zero'}
function diffText(d){return (d>0?'+':'')+d.toFixed(2)+'%'}
function addStack(){let n=$('sn').value.trim(),t=N($('tb').value),r=N($('rmc').value),c=$('com').value;if(!n||t<1||r<0||!c)return alert('Stack Number, Total Bags, RMC aur Commodity fill karein.');if(db.stacks[n])return alert('Ye Stack Number already Under Issue me hai.');db.stacks[n]={sn:n,total:t,rmc:r,com:c,entries:[]};saveDB();$('sn').value='';$('tb').value='';$('rmc').value='';$('com').value='';openUpdate(n)}
function openUpdate(no,entryId=null){cur=no;editId=entryId;let s=db.stacks[no];if(!s)return;let e=entryId?s.entries.find(x=>x.id===entryId):null;$('truck').value=e?.truck||'';$('bags').value=e?.bags||'';$('moist').value=e?.moist??'';$('slip').value=e?.slip||'Yes';$('mr').textContent=N(s.rmc).toFixed(2)+'%';$('mb').textContent=rem(s,entryId);$('mc').textContent=s.com;$('modalTitle').textContent=e?'✏️ EDIT MOISTURE ENTRY':'💧 MOISTURE UPDATE';$('df').textContent='—';$('df').className='diff';$('modal').classList.add('show');preview()}
function closeUpdate(){$('modal').classList.remove('show');cur=null;editId=null}
function preview(){if(!cur)return;let s=db.stacks[cur],b=N($('bags').value),m=N($('moist').value);if(!b||!m){$('df').textContent='—';$('df').className='diff';return}let max=s.com==='Wheat'?14:15;if(m>max){$('df').textContent='Max '+max.toFixed(2)+'%';$('df').className='diff neg';return}let d=imc(s,b,m,editId);d=d-N(s.rmc);$('df').textContent=diffText(d);$('df').className='diff '+diffClass(d)}
function saveEntry(){let s=db.stacks[cur],b=N($('bags').value),m=N($('moist').value),max=s.com==='Wheat'?14:15;if(b<1)return alert('Update Bags enter karein.');if(b>rem(s,editId))return alert('Update Bags remaining bags se zyada nahi ho sakte.');if(m<0||m>max)return alert('Maximum moisture '+max.toFixed(2)+'% hai.');let data={id:editId||Date.now(),truck:$('truck').value.trim(),bags:b,moist:m,slip:$('slip').value};if(editId){let i=s.entries.findIndex(e=>e.id===editId);if(i>=0)s.entries[i]=data}else s.entries.push(data);saveDB();closeUpdate();let bal=rem(s);if(!editId&&bal>=-100&&bal<=50&&confirm('Balance '+bal+' bags hai. History me move karna hai?')){db.history[s.sn]=JSON.parse(JSON.stringify(s));delete db.stacks[s.sn];saveDB()}}
function openStackEdit(n){let s=db.stacks[n];if(!s)return;$('oldStack').value=n;$('esn').value=s.sn;$('etb').value=s.total;$('ermc').value=s.rmc;$('ecom').value=s.com;$('stackModal').classList.add('show')}
function closeStackEdit(){$('stackModal').classList.remove('show')}
function saveStackEdit(){let old=$('oldStack').value,n=$('esn').value.trim(),t=N($('etb').value),r=N($('ermc').value),c=$('ecom').value;if(!n||t<1||r<0||!c)return alert('Stack Number, Total Bags, RMC aur Commodity fill karein.');if(n!==old&&db.stacks[n])return alert('New Stack Number already exists.');let s=db.stacks[old];if(t<used(s))return alert('Total Bags updated entries ke total se kam nahi ho sakte.');if(n!==old){s.sn=n;delete db.stacks[old];db.stacks[n]=s} s.total=t;s.rmc=r;s.com=c;saveDB();closeStackEdit()}
function del(n,id){if(confirm('Delete this moisture entry?')){let s=db.stacks[n];s.entries=s.entries.filter(e=>e.id!==id);saveDB()}}
function completeStack(n){let s=db.stacks[n],bal=rem(s);if(bal<-100||bal>50)return alert('History confirmation sirf +50 se -100 bags ke balance range me available hai.');if(confirm('Balance '+bal+' bags hai. History me move karna hai?')){db.history[s.sn]=JSON.parse(JSON.stringify(s));delete db.stacks[n];saveDB()}}
function render(){let stacks=Object.values(db.stacks),make=s=>'<div class="stack '+(s.com==='Wheat'?'wheat':'rice')+'"><div class="top"><b>'+esc(s.sn)+'</b><span class="badge">'+s.com+'</span></div><div class="small">Total: '+s.total+' | Updated: '+used(s)+' | Remaining: '+rem(s)+' | RMC: '+N(s.rmc).toFixed(2)+'%</div><div class="stackActions"><button onclick="openUpdate(\''+esc(s.sn)+'\')">💧 Update Moisture</button><button class="secondary" onclick="openStackEdit(\''+esc(s.sn)+'\')">✏️ Edit / RMC</button></div><button class="secondary" style="margin-top:7px" onclick="completeStack(\''+esc(s.sn)+'\')">📚 Complete / History</button></div>';$('issueCount').textContent=stacks.length;$('wi').innerHTML=stacks.filter(s=>s.com==='Wheat').map(make).join('')||'<span class="muted">No Wheat stack.</span>';$('ri').innerHTML=stacks.filter(s=>s.com==='Rice').map(make).join('')||'<span class="muted">No Rice stack.</span>';let rows=[];stacks.forEach(s=>s.entries.forEach(e=>rows.push({s,e})));$('en').innerHTML=rows.length?'<div class="table"><table><tr><th>Sr No.</th><th>Truck Number</th><th>Bags</th><th>Moisture</th><th>Slip</th><th>Action</th></tr>'+rows.map((x,i)=>{let I=imc(x.s),d=I-x.s.rmc;return '<tr><td>#'+(i+1)+'<br><b>'+esc(x.s.sn)+'</b></td><td>'+esc(x.e.truck||'-')+'</td><td>'+x.e.bags+'</td><td>'+N(x.e.moist).toFixed(2)+'%</td><td>'+x.e.slip+'</td><td><div style="display:grid;gap:5px"><button onclick="openUpdate(\''+esc(x.s.sn)+'\','+x.e.id+')">✏️ Edit</button><button class="danger" onclick="del(\''+esc(x.s.sn)+'\','+x.e.id+')">Delete</button></div></td></tr><tr><td colspan="6"><div class="entryCalc"><b>RMC:</b> '+N(x.s.rmc).toFixed(2)+'% &nbsp; <b>IMC:</b> '+I.toFixed(2)+'% &nbsp; <b>Difference:</b> <span class="'+diffClass(d)+'">'+diffText(d)+'</span></div></td></tr>'}).join('')+'</table></div>':'<span class="muted">No saved entries.</span>';$('hi').innerHTML=Object.values(db.history).map(s=>'<div class="stack '+(s.com==='Wheat'?'wheat':'rice')+'"><b>'+esc(s.sn)+'</b> — '+s.com+'<div class="small">Entries: '+s.entries.length+' | Total Bags: '+s.total+' | RMC: '+N(s.rmc).toFixed(2)+'%</div></div>').join('')||'<span class="muted">No completed stack.</span>'}
function clearHistory(){if(prompt('History clear PIN:')!=='9001')return alert('Wrong PIN');if(confirm('Clear history?')){db.history={};saveDB()}}
render();
</script></body></html>
